name: Monitor Calvren public API availability
on:
  workflow_dispatch:
  schedule:
    - cron: "13 */2 * * *"
permissions:
  contents: read
concurrency:
  group: calvren-ops-monitor
  cancel-in-progress: false
jobs:
  api-check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check backend reachability, optionally review private delivery counts
        env:
          CALVREN_CRON_TOKEN: ${{ secrets.CALVREN_CRON_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const origin="https://calvren.ca";
          const response=await fetch(origin+"/api/health",{
            method:"GET",headers:{Accept:"application/json"},
            signal:AbortSignal.timeout(25000),redirect:"error",cache:"no-store"
          });
          if(!response.ok)throw Error("Calvren backend unavailable (HTTP "+response.status+").");
          const health=await response.json();
          if(health.ok!==true||health.service!=="calvren")throw Error("Unexpected backend health response.");
          console.log("PUBLIC_BACKEND_REACHABLE");
          const secret=process.env.CALVREN_CRON_TOKEN;
          if(!secret){
            console.warn("PRIVATE_DELIVERY_COUNTS_NOT_CHECKED: optional CALVREN_CRON_TOKEN is not configured in GitHub. Review the owner dashboard for recorded delivery failures.");
            process.exit(0);
          }
          const privateResponse=await fetch(origin+"/api/internal/ops-health",{
            method:"GET",headers:{Authorization:"Bearer "+secret,Accept:"application/json"},
            signal:AbortSignal.timeout(25000),redirect:"error",cache:"no-store"
          });
          if(!privateResponse.ok)throw Error("Private service health check failed (HTTP "+privateResponse.status+").");
          const data=await privateResponse.json();
          if(data.ok!==true)throw Error("Incomplete private operations report.");
          console.log("PRIVATE_DELIVERY_STATUS",JSON.stringify({failed_7d:data.failed_deliveries_7d,
            unknown_7d:data.unknown_deliveries_7d,handoffs_pending:data.human_handoffs_pending,
            followups_health:data.followups_health,hub_health:data.hub_health}));
          if(data.delivery_alert||data.followups_health==="failed"||data.hub_health==="failed")
            throw Error("Recorded delivery failure or scheduler execution failure requires owner review.");
          NODE
