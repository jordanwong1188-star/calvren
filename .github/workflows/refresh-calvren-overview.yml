name: Refresh Calvren overview video
on:
  push:
    paths:
      - '.github/workflows/refresh-calvren-overview.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install --user Pillow
      - name: Replace outdated pricing and domain in the video
        run: python scripts/refresh-calvren-overview.py public/media/calvren-overview.mp4 public/media/calvren-overview-new.mp4 public/media/calvren-overview.jpg
      - name: Commit refreshed video and poster
        run: |
          mv public/media/calvren-overview-new.mp4 public/media/calvren-overview.mp4
          git config user.name "Calvren video updater"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/media/calvren-overview.mp4 public/media/calvren-overview.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Refresh video prices and calvren.ca closing screen"
            git push
          fi
