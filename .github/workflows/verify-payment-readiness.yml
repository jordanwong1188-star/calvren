name: Verify Calvren payment readiness

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/verify-payment-readiness.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch public payment page and non-secret readiness JSON
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 12 --max-time 30 https://calvren.pages.dev/payment -o payment.html
          grep -q 'id="billing-checkout"' payment.html
          grep -q 'id="discount-code"' payment.html
          echo 'PAYMENT_PAGE_PRESENT'
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 12 --max-time 30 -H 'Accept: application/json' -H 'Cache-Control: no-cache' https://calvren.pages.dev/api/billing/public -o billing.json
          node --input-type=module <<'NODE'
          import {readFileSync} from "node:fs";
          const data=JSON.parse(readFileSync("billing.json","utf8"));
          // No key or webhook value may be printed, only public readiness.
          const safe={ready:data.ready,monthly:data.amount,setup:data.setup_amount,
            first_payment:data.first_payment,currency:data.currency,test_mode:data.test_mode,message:data.message};
          console.log("CALVREN_BILLING_PUBLIC:",JSON.stringify(safe));
          if(data.ready!==true||data.amount!==9900||data.setup_amount!==34900
            ||data.first_payment!==44800||data.currency!=="cad"||data.test_mode!==false)
            process.exit(1);
          NODE
