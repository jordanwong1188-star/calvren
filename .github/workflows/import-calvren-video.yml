name: Import Calvren homepage introduction
on:
  push:
    paths:
      - '.github/workflows/import-calvren-video.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bring approved promo video into the site
        env:
          VIDEO_SOURCE_URL: 'https://storage.googleapis.com/vidiq-user-videos/1dd7c10c-b428-45da-9f38-76a3b5476664/e4751d95-ed58-457d-9c16-807685fd0bdf.mp4?GoogleAccessId=ai-proxy-20261001%40studious-pen-429.vid.io.iam.gserviceaccount.com&Expires=1795054809&Signature=d4HnpIjyNVYER9qv%2BdXi5ePVMi3o4OlBhp%2FeNdb8JNKg3KZGHh45TQuKHsjymkKZHdGNX2ihnhkIGMdTwR7FOEp%2B4eFfeJ%2BLKuzJTQPnEgY%2Fo734OGhND1XRhU30YDYr53cw4VUQNkVJXDhA5STMQ%2BMnxvSibMg7Phbw07CD8l09ehnuiKBV%2BjzFAIizII1DvQQsWD8H9zLhrYkla4%2FA2oVSN6PVYsoRQ%2BNa7MoEMsUnQZ%2FxyHT5kOldAXvOf2hQPY%2Bp3MRGUtTYW2lsNMWWV3axfaIuoSjk0wbuDLJQckEDPIThnG2F2nZJ2V7Ywi0g9tG5cE3z3Ff2a4u7w5F1yQ%3D%3D'
        run: |
          set -euo pipefail
          mkdir -p public/media
          curl --fail --location --retry 3 "$VIDEO_SOURCE_URL" --output public/media/calvren-intro.mp4
          test "$(stat -c%s public/media/calvren-intro.mp4)" -gt 100000
          ffprobe -v error public/media/calvren-intro.mp4
          ffmpeg -y -ss 00:00:02 -i public/media/calvren-intro.mp4 -frames:v 1 -vf "scale=910:-2" -q:v 3 public/media/calvren-intro.jpg
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/media/calvren-intro.mp4 public/media/calvren-intro.jpg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add Calvren homepage introduction video and poster'
          git push
