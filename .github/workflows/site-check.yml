name: Check published Calvren
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'netlify/**'
      - 'netlify.toml'
      - 'tests/**'
      - '.github/workflows/site-check.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check the published site
        run: node tests/site-check.mjs
        env:
          CALVREN_TEST_SITE: https://calvren.pages.dev
      - name: Generate local fixtures for production demo checks
        run: node scripts/build-demo.mjs
      - name: Check the production demo entry and simulated workflow
        run: node tests/conversion-browser-check.mjs
        env:
          CALVREN_PREVIEW_URL: https://calvren.pages.dev
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calvren-browser-review
          path: artifacts/
          retention-days: 7
  owner-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local source preview
        run: python3 -m http.server 8080 --directory public > /tmp/calvren-preview.log 2>&1 &
      - name: Check owner workspace from current source
        run: node tests/owner-preview-check.mjs
      - name: Save owner workspace preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calvren-owner-source-preview
          path: artifacts/
          retention-days: 7
