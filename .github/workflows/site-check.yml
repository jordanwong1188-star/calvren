name: Check published Calvren
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'netlify/**'
      - 'netlify.toml'
      - 'tests/**'
      - '.github/workflows/site-check.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check the published site
        run: node tests/site-check.mjs
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calvren-browser-review
          path: artifacts/
          retention-days: 7
