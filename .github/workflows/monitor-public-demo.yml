name: Monitor Calvren public demo
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test runner
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify public guest demo, booking dates and named business studies
        env:
          CALVREN_PUBLIC_SITE: https://calvren.pages.dev
        run: node tests/public-demo-smoke.mjs
