name: Publish Calvren backend
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Check Calvren"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: calvren-supabase-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate portable backend source
        run: npm run build:supabase
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Publish only when owner credentials are available
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Backend publishing is not enabled. Add SUPABASE_ACCESS_TOKEN to GitHub Actions secrets."
            exit 0
          fi
          supabase functions deploy calvren --project-ref xjfsukhfmkgvlfpgjevg --no-verify-jwt
